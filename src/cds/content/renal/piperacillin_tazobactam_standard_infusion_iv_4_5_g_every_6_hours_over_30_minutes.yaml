renal_bands:
- id: below_20
  lower:
    value: '0'
    inclusive: false
  upper:
    value: '20'
    inclusive: false
  outcome: recommendation
  recommendation:
    action: adjust_dose
    dose:
      value: '2.25'
      unit: g
    route_id: iv
    frequency_interval:
      value: '6'
      unit: hours
    infusion_duration:
      value: '30'
      unit: minutes
    rationale: The selected prescribing-information renal table lists 2.25 g IV every 6 hours for the
      nosocomial-pneumonia regimen when creatinine clearance is less than 20 mL/min.
    monitoring:
    - Monitor renal function during treatment and reassess this maintenance schedule if renal function
      changes; the selected label requires renal dose reduction at creatinine clearance of 40 mL/min or
      less.
    - Closely monitor patients with renal impairment or seizure disorders for neuromuscular excitability
      or seizures, because higher doses and renal impairment increase the risk of central nervous system
      adverse reactions.
    - Periodically assess hematopoietic function during prolonged therapy, especially when treatment continues
      for 21 days or longer.
    - Consider the product sodium load and periodically assess electrolytes in patients with low potassium
      reserves or other risk factors for hypokalemia.
  no_recommendation_reason: null
  source_ids:
