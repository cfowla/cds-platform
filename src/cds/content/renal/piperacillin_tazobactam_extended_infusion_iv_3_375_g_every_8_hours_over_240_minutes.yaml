limitations:
- Prototype only — not for direct clinical use; use only with synthetic or properly de-identified cases.
- Draft content is not eligible for rule matching and has not received independent clinical-content review.
- This off-label extended-infusion document evaluates only the exact supplied maintenance regimen and
  source context; it does not select antimicrobial therapy, infer an organism or MIC, interpret susceptibility,
  determine duration, or recommend an alternative agent.
- The dosing source is a population pharmacokinetic model and 9,999-subject Monte Carlo simulation, not
  FDA labeling, a randomized clinical-outcomes trial, or clinical validation.
- The model evaluated 50% fT greater than MIC; probability of target attainment varied by MIC and was
  suboptimal at 32 mg/L for every evaluated regimen. This schema has no MIC field and must not generate
  MIC-specific decisions.
- The continuous greater-than-zero through 20 mL/min interval, the positive lower renal-domain boundary,
  the hospitalized_serious_gram_negative_infection identifier, and formulation_id null are provisional
  representations pending independent review.
- The selected DailyMed source is included only for product safety monitoring; it does not support or
  approve the extended-infusion dose, interval, or 240-minute infusion strategy.
- Pediatric, unstable-renal-function, dialysis, other renal-replacement-therapy, continuous infusion,
  4.5 g extended infusion, unlisted intervals, and infusion durations other than 240 minutes are unsupported.