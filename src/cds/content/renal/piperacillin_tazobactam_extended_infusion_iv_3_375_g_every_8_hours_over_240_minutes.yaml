  limitations:
  - Prototype only — not for direct clinical use; use only with synthetic or properly de-identified cases.
  - Limited to adults aged 18 years or older with explicitly stable renal function and unindexed Cockcroft-Gault
    creatinine clearance in mL/min.
  - Excludes intermittent hemodialysis, peritoneal dialysis, continuous renal replacement therapy, other
    renal replacement therapy, and acute or rapidly changing kidney function.
  - Requires exact source-context indication, medication, route, formulation when applicable, total-product
    dose, frequency interval, and infusion duration; no aliases, inference, unit conversion, interpolation,
    extrapolation, or fallback.
