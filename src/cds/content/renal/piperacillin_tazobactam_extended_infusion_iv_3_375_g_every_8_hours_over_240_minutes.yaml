renal_bands:
- id: at_or_below_20
  lower:
    value: '0'
    inclusive: false
  upper:
    value: '20'
    inclusive: true
  outcome: recommendation
  recommendation:
    action: adjust_dose
    dose:
      value: '3.375'
      unit: g
    route_id: iv
    frequency_interval:
      value: '12'
      unit: hours
    infusion_duration:
      value: '240'
      unit: minutes
    rationale: The selected population-PK and Monte Carlo analysis supports extending the exact 3.375
      g over 4 hours regimen from every 8 hours to every 12 hours when Cockcroft-Gault creatinine clearance
      is 20 mL/min or less.
    monitoring:
    - Reassess the explicitly supplied Cockcroft-Gault creatinine clearance if renal function changes;
      the modeled extended-infusion interval changes only at creatinine clearance of 20 mL/min or less.
    - Closely monitor patients with renal impairment or seizure disorders for neuromuscular excitability
      or seizures, because higher doses and renal impairment increase the risk of central nervous system
      adverse reactions.
    - Periodically assess hematopoietic function during prolonged therapy, especially when treatment continues
      for 21 days or longer.
    - Consider the product sodium load and periodically assess electrolytes in patients with low potassium
      reserves or other risk factors for hypokalemia.
