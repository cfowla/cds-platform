name: Day 21 verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run targeted Day 21 contract tests
        run: python -m pytest tests/contract/test_domain_serialization_contracts.py -q | tee targeted-results.txt

      - name: Run full test suite
        run: python -m pytest -q | tee full-results.txt

      - name: Publish verification results
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "Day 21 repository-native verification passed."
            echo
            echo '```text'
            echo '$ python -m pytest tests/contract/test_domain_serialization_contracts.py -q'
            cat targeted-results.txt
            echo
            echo '$ python -m pytest -q'
            cat full-results.txt
            echo '```'
          } > verification-comment.md
          gh pr comment "$PR_NUMBER" --body-file verification-comment.md
