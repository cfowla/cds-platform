name: Day 21 verification

on:
  push:
    branches:
      - agent/day21-domain-serialization-contracts

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run targeted Day 21 contract tests
        run: python -m pytest tests/contract/test_domain_serialization_contracts.py -q

      - name: Run full test suite
        run: python -m pytest -q
