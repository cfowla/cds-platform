name: Day 20 Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused golden-example tests
        run: python -m pytest tests/unit/utils/test_golden_json_examples.py -q

      - name: Run full test suite
        run: python -m pytest -q
