name: Temporary cefepime golden verification

on:
  push:
    branches:
      - agent/review-cefepime-golden-semantic-diff

permissions:
  contents: read

jobs:
  focused-pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run focused cefepime golden tests
        run: python -m pytest tests/unit/rules/test_cefepime_golden_cases.py -q
